# Cấu hình Cloudinary (Bài 3 - upload ảnh đại diện trong trang hồ sơ).
# Lấy 3 giá trị ở https://console.cloudinary.com -> Dashboard (Product Environment Credentials).
# Có thể đặt biến môi trường thay cho file này (an toàn hơn khi đẩy lên GitHub):
#   CLOUDINARY_URL=cloudinary://<api_key>:<api_secret>@<cloud_name>
# hoặc CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY / CLOUDINARY_API_SECRET.
cloudinary.cloud_name=your_cloud_name
cloudinary.api_key=your_api_key
cloudinary.api_secret=your_api_secret
# Thư mục chứa ảnh đại diện trên Cloudinary
cloudinary.folder=shopping/avatars
